# Normalized Linux x86-64 runtime from the supplied server conda list.
# Core versions are retained; unrelated desktop/system packages are omitted.
# Use one coherent PyTorch 2.1 / CUDA 12.1 stack, not the extra pip CUDA 12.4 stack.
name: AGAT-DDI
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.8.20
  - pip=24.2
  - setuptools=75.1.0
  - wheel=0.44.0
  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - mkl=2023.1.0
  - pip:
      # Matching prebuilt Linux CPython 3.8 PyG extension wheels.
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - numpy==1.24.4
      - pandas==2.0.3
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - torch-geometric==2.5.3
      - torch-scatter==2.1.2+pt21cu121
      - torch-sparse==0.6.18+pt21cu121
      - rdkit==2024.3.5
      - matplotlib==3.7.5
      - networkx==3.0
      - tqdm==4.67.1
      - func-timeout==4.3.5
